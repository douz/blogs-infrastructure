apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../bootstrap/argocd
  - certificate.yaml
  - ingress.yaml
patches:
  - target:
      kind: Namespace
      name: argocd
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata:
        name: argocd
